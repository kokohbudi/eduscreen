spring:
  application:
    name: eduscreen

  jpa:
    # TC-17: skema adalah milik migrasi Flyway. Hibernate hanya memvalidasi,
    # tidak pernah membuat atau mengubah tabel.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  threads:
    virtual:
      enabled: true

server:
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        # Dimatikan di profil local karena pengembangan berjalan di HTTP (TC-29).
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.eduscreen.app: DEBUG

eduscreen:
  # Dibaca DummyIdentityProviderAdapter (TC-04). Wajib bernilai local atau demo;
  # tidak diset pun ditolak. Adapter itu lahir di T016.
  env: ${EDUSCREEN_ENV:}
