<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Lupa Password')}"></head>
<body>
<div th:replace="~{layout/base :: page('Lupa Password', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <div class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-6">

      <!--
        Konfirmasi di bawah sengaja seragam: ia muncul entah alamatnya terdaftar atau tidak.
        Membedakannya akan mengubah formulir ini menjadi alat memeriksa email siapa saja yang
        punya akun di sekolah ini.
      -->
      <div th:if="${terkirim}" role="status"
           class="rounded border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-700">
        Bila alamat itu terdaftar, tautan pemulihan sudah dikirim ke sana. Periksa kotak masuk Anda.
      </div>

      <form th:unless="${terkirim}" th:action="@{/lupa-password}" method="post" class="space-y-4">
        <p class="text-sm text-slate-600">
          Masukkan alamat email akun Anda. Tautan penetapan password baru akan dikirim ke sana.
        </p>
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
          <input type="email" id="email" name="email" required autofocus
                 class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none">
        </div>
        <button type="submit"
                class="w-full rounded bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-800">
          Kirim tautan
        </button>
      </form>

      <p class="mt-4 text-center text-sm">
        <a th:href="@{/login}" class="text-slate-500 underline">Kembali ke halaman masuk</a>
      </p>
    </div>

  </div>
</div>
</body>
</html>
