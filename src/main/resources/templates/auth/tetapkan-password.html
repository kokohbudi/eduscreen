<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Tetapkan Password')}"></head>
<body>
<div th:replace="~{layout/base :: page('Tetapkan Password', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <div class="card mx-auto max-w-md">
      <p class="text-sm text-ink-2">
        Halo <strong class="text-ink" th:text="${namaLengkap}">Nama</strong>, tetapkan password untuk akun Anda.
      </p>

      <div th:if="${galat}" role="alert" class="alert alert-danger mt-4" th:text="${galat}">Galat</div>

      <form th:action="@{${action}}" method="post" class="mt-4 space-y-4">
        <div>
          <label for="password" class="label">Password baru</label>
          <input type="password" id="password" name="password" required minlength="8" autofocus
                 autocomplete="new-password" class="input">
          <p class="hint">Minimal 8 karakter.</p>
        </div>
        <button type="submit" class="btn btn-primary w-full">Simpan password</button>
      </form>
    </div>

  </div>
</div>
</body>
</html>
