<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Tetapkan Password')}"></head>
<body>
<div th:replace="~{layout/base :: page('Tetapkan Password', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <div class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-6">
      <p class="text-sm text-slate-600">
        Halo <strong th:text="${namaLengkap}">Nama</strong>, tetapkan password untuk akun Anda.
      </p>

      <div th:if="${galat}" role="alert"
           class="mt-4 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800"
           th:text="${galat}">Galat</div>

      <form th:action="@{${action}}" method="post" class="mt-4 space-y-4">
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700">Password baru</label>
          <input type="password" id="password" name="password" required minlength="8" autofocus
                 autocomplete="new-password"
                 class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none">
          <p class="mt-1 text-xs text-slate-500">Minimal 8 karakter.</p>
        </div>
        <button type="submit"
                class="w-full rounded bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-800">
          Simpan password
        </button>
      </form>
    </div>

  </div>
</div>
</body>
</html>
