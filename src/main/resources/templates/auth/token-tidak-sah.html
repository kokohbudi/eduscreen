<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Tautan Tidak Berlaku')}"></head>
<body>
<div th:replace="~{layout/base :: page('Tautan Tidak Berlaku', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <!--
      Tautan salah dan tautan kedaluwarsa sengaja tidak dibedakan. Membedakannya memberi tahu
      bahwa sebuah token pernah sah, dan itu cukup untuk menebak-nebak token lain.
    -->
    <div class="card mx-auto max-w-md">
      <p class="text-sm text-ink-2">
        Tautan ini tidak berlaku. Tautan undangan dan pemulihan password hanya bisa dipakai sekali
        dan punya masa berlaku.
      </p>
      <p class="mt-5">
        <a th:href="@{/lupa-password}" class="btn btn-primary">Minta tautan baru</a>
      </p>
    </div>

  </div>
</div>
</body>
</html>
