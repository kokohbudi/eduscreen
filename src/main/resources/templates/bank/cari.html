<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${(master ?: false)} ? 'Cari Soal Master' : 'Cari Soal')}"></head>
<body>
<div th:replace="~{layout/base :: page(${(master ?: false)} ? 'Cari Soal Master' : 'Cari Soal', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <!-- Dipakai Bank Soal Client maupun ruang kerja master (FR-019, Task 14): Question menyebar
         lintas Subject dan Paket, dan bekerja di dalam satu Paket lewat tingkat isi
         (bank/isi.html) tidak selalu cukup kalau belum tahu soalnya ada di Paket yang mana. -->
    <a th:href="@{__${basePath ?: '/bank-soal'}__}" class="crumb">← Semua Paket</a>

    <form method="get" th:action="@{__${basePath ?: '/bank-soal'}__/cari}"
          class="card mb-6 grid grid-cols-1 items-end gap-3 sm:grid-cols-2 lg:grid-cols-5">
      <div>
        <label for="subjectId" class="label">Subject</label>
        <select id="subjectId" name="subjectId" onchange="this.form.submit()"
                class="select">
          <option value="">Semua Subject</option>
          <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}"
                  th:selected="${subjectId != null and subjectId == s.id}">Subject</option>
        </select>
      </div>
      <div>
        <label for="topicId" class="label">Topic</label>
        <select id="topicId" name="topicId" onchange="this.form.submit()" th:disabled="${subjectId == null}"
                class="select">
          <option value="">Semua Topic</option>
          <option th:each="t : ${topics}" th:value="${t.id}" th:text="${t.title}"
                  th:selected="${topicId != null and topicId == t.id}">Topic</option>
        </select>
      </div>
      <!-- Status terbit/draf hanya ada pada konten master (FR-066); Question milik Client tidak
           punya keadaan itu sama sekali. -->
      <div th:if="${master ?: false}">
        <label for="status" class="label">Status</label>
        <select id="status" name="status" onchange="this.form.submit()"
                class="select">
          <option value="">Semua</option>
          <option value="DRAF" th:selected="${status != null and status.name() == 'DRAF'}">Draf</option>
          <option value="TERBIT" th:selected="${status != null and status.name() == 'TERBIT'}">Terbit</option>
        </select>
      </div>
      <div class="sm:col-span-2 lg:col-span-1">
        <label for="q" class="label">Cari</label>
        <input type="text" id="q" name="q" th:value="${q}" placeholder="Kata kunci isi soal..."
               class="input">
      </div>
      <button type="submit" class="btn btn-primary">
        Cari
      </button>
    </form>

    <ol class="space-y-1.5">
      <!-- th:each di blok pembungkus, th:replace di elemen lain, nomor lewat parameter fragmen:
           sama alasan dengan bank/isi.html :: barisSoal, yang dipakai ulang persis di sini
           supaya status/terbit/tarik/hapus tidak ditulis dua kali. -->
      <th:block th:each="q, it : ${hasil}">
        <li th:replace="~{bank/isi :: barisSoal(q=${q}, nomor=${it.index + 1})}"></li>
      </th:block>
    </ol>
    <p th:if="${hasil.totalElements == 0}" class="empty">Belum ada soal yang cocok.</p>

    <div class="mt-4 flex items-center justify-between text-sm text-ink-2" th:if="${hasil.totalPages > 0}">
      <span th:text="|Halaman ${hasil.number + 1} dari ${hasil.totalPages}|">Halaman</span>
      <div class="flex gap-2">
        <a th:if="${hasil.hasPrevious()}"
           th:href="@{__${basePath ?: '/bank-soal'}__/cari(subjectId=${subjectId}, topicId=${topicId}, q=${q}, status=${status}, page=${hasil.number - 1})}"
           class="btn btn-secondary btn-sm">Sebelumnya</a>
        <a th:if="${hasil.hasNext()}"
           th:href="@{__${basePath ?: '/bank-soal'}__/cari(subjectId=${subjectId}, topicId=${topicId}, q=${q}, status=${status}, page=${hasil.number + 1})}"
           class="btn btn-secondary btn-sm">Berikutnya</a>
      </div>
    </div>

  </div>
</div>
</body>
</html>
