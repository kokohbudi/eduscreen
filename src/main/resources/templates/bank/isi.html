<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${paket.title})}"></head>
<body>
<div th:replace="~{layout/base :: page(${paket.title}, ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <p class="mb-4 text-sm">
      <a th:href="@{/bank-soal(subjectId=${paket.subjectId})}" class="text-slate-600 underline">← Semua Paket</a>
    </p>

    <!-- Topic adalah pengelompokan di dalam halaman ini, bukan tingkat navigasi keempat.
         Paket 30 soal dengan 3 Topic tidak layak menambah satu klik lagi (ADR-0018). -->
    <section th:each="t : ${topics}" th:with="soalTopic=${soalPerTopic[t.id]}"
             class="mb-6 rounded border border-slate-200 bg-white p-4">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="text-sm font-semibold" th:text="${t.title}">Topic</h2>
        <a th:href="@{__${basePath ?: '/bank-soal'}__/paket/{id}/soal/baru(id=${paket.id},topicId=${t.id})}"
           class="rounded border border-slate-300 px-2 py-1 text-xs font-medium hover:bg-slate-100">
          + Soal
        </a>
      </div>
      <ol class="space-y-1">
        <!-- th:each di blok pembungkus, th:replace di elemen lain: keduanya di satu elemen
             membuat fragmen dipanggil sebelum variabel iterasinya terikat (lihat
             MasterContentRenderTest, dan komentar sama di bank/paket.html). Nomor tampilan
             dikirim sebagai parameter fragmen dari ${it.index}, bukan dibaca dari q.position:
             position tersimpan berlubang setelah penghapusan (nextPosition cuma menambah dari
             maksimum, tidak pernah merapatkan), jadi memakainya langsung membuat nomor melompat
             1, 3 begitu soal di tengah dihapus (temuan review Task 10). -->
        <th:block th:each="q, it : ${soalTopic ?: {}}">
          <li th:replace="~{::barisSoal(q=${q}, nomor=${it.index + 1})}"></li>
        </th:block>
      </ol>
      <p th:if="${soalTopic == null or soalTopic.isEmpty()}"
         class="text-sm text-slate-500">Belum ada soal di Topic ini.</p>
    </section>

    <div class="flex flex-wrap items-end gap-4">
      <form method="post" class="flex items-end gap-2 text-sm"
            th:action="@{__${basePath ?: '/bank-soal'}__/paket/{id}/topic(id=${paket.id})}">
        <div>
          <label for="topicBaru" class="block font-medium text-slate-700">Topic baru</label>
          <input type="text" id="topicBaru" name="title" required
                 class="mt-1 rounded border border-slate-300 px-2 py-1.5">
        </div>
        <button type="submit" class="rounded border border-slate-300 px-3 py-1.5 font-medium hover:bg-slate-100">
          Tambah
        </button>
      </form>

      <button type="button"
              th:attr="hx-get=@{__${basePath ?: '/bank-soal'}__/paket/{id}/pinjam(id=${paket.id})}"
              hx-target="#panel-pinjam" hx-swap="innerHTML"
              class="rounded border border-slate-300 px-3 py-1.5 text-sm font-medium hover:bg-slate-100">
        Pinjam soal dari Paket lain
      </button>
    </div>

    <div id="panel-pinjam" class="mt-6"></div>

  </div>

  <!--
    Fragmen <option> Topic milik satu Paket, dipakai ulang panel penelusuran perakit Exercise
    (GET /bank-soal/paket/{id}/topic-options, Task 12) supaya nama dan urutan Topic yang dilihat
    Guru di sana identik dengan yang dilihat di halaman isi Paket ini — bukan salinan yang bisa
    diam-diam melenceng.
  -->
  <select th:fragment="opsiTopic" th:remove="tag">
    <option value="">-- Topic --</option>
    <option th:each="t : ${topics}" th:value="${t.id}" th:text="${t.title}">Topic</option>
  </select>

  <!--
    Satu baris Question, dipisah jadi fragmen ber-id: penerbitan dan penarikan (mode ${master}
    saja) serta penghapusan (Client maupun master, FR-018) menukar baris ini saja lewat HTMX,
    bukan memuat ulang seluruh halaman (TC-14). ${nomor} datang sebagai parameter, opsional:
    perulangan mengirimnya dari ${it.index}, sementara swap baris tunggal (terbit/tarik/hapus)
    mengirim indeks yang dihitung ulang controller lewat findByTopicIdOrderByPositionAsc,
    sehingga tetap padat walau posisi tersimpan berlubang.
  -->
  <li th:fragment="barisSoal(q, nomor)" th:id="|soal-${q.id}|"
      class="flex flex-wrap items-center gap-2 rounded border border-slate-100 p-2 text-sm">
    <span class="mt-0.5 w-6 shrink-0 text-right text-slate-400" th:text="${nomor}">1</span>
    <!-- Cuplikan dari body_text yang teks polos, bukan body_html: markup dan gambar tidak boleh
         ikut terpotong ke dalam daftar (TC-25). -->
    <span class="flex-1" th:text="${#strings.abbreviate(q.bodyText, 110)}">Cuplikan soal</span>

    <!-- Keadaan terbit hanya ada pada konten master; konten Client tidak memilikinya (FR-066). -->
    <span th:if="${master ?: false}">
      <span th:if="${q.published}"
            class="rounded bg-emerald-50 px-2 py-1 text-xs font-medium text-emerald-700">Terbit</span>
      <span th:unless="${q.published}"
            class="rounded bg-slate-100 px-2 py-1 text-xs font-medium text-slate-600">Belum terbit</span>
    </span>

    <a th:href="@{__${basePath ?: '/bank-soal'}__/soal/{id}(id=${q.id})}"
       class="shrink-0 text-slate-600 underline">Ubah</a>

    <button th:if="${(master ?: false) and !q.published}"
            th:attr="hx-post=@{__${basePath}__/soal/{id}/terbit(id=${q.id})},hx-target=|#soal-${q.id}|"
            hx-swap="outerHTML"
            class="shrink-0 rounded border border-emerald-300 px-2 py-1 text-xs text-emerald-700 hover:bg-emerald-50">
      Terbitkan
    </button>
    <button th:if="${(master ?: false) and q.published}"
            th:attr="hx-post=@{__${basePath}__/soal/{id}/tarik(id=${q.id})},hx-target=|#soal-${q.id}|"
            hx-swap="outerHTML"
            hx-confirm="Tarik soal ini dari katalog? Salinan yang sudah diadopsi Client tidak terpengaruh."
            class="shrink-0 rounded border border-amber-300 px-2 py-1 text-xs text-amber-700 hover:bg-amber-50">
      Tarik
    </button>
    <!-- Hapus tersedia di Bank Soal Client maupun ruang kerja master (FR-018, kembali dibuka
         Task 14 setelah keliru dicatat sudah dicabut): soal hilang dari pencarian, Exercise/
         Assignment/pengerjaan yang sudah memakainya tetap utuh (BR-Q04). Pesan konfirmasinya saja
         yang beda, karena hanya konten master yang punya salinan hasil adopsi untuk disebut. -->
    <button th:attr="hx-delete=@{__${basePath ?: '/bank-soal'}__/soal/{id}(id=${q.id})},
                     hx-target=|#soal-${q.id}|,
                     hx-confirm=${(master ?: false)} ? 'Hapus soal ini dari bank soal master? Salinan yang sudah diadopsi Client tidak terpengaruh.' : 'Hapus soal ini dari bank soal? Exercise yang sudah memakainya tidak terpengaruh.'"
            hx-swap="outerHTML"
            class="shrink-0 rounded border border-red-200 px-2 py-1 text-xs text-red-700 hover:bg-red-50">
      Hapus
    </button>
  </li>

  <li th:fragment="konfirmasiHapus" class="rounded border border-emerald-100 bg-emerald-50 p-2 text-sm text-emerald-700"
      th:text="${pesan}">Soal dihapus.</li>

  <!--
    Panel pinjam. Soal yang salinannya sudah ada di Paket ini tidak dirender sama sekali
    (AC-B04): menampilkannya lalu menolak saat disimpan hanya memindahkan kekecewaan ke
    belakang.
  -->
  <div th:fragment="panelPinjam" class="rounded border border-slate-200 bg-white p-4">
    <!-- Ganti sumber lewat hx-get ke panel ini sendiri, bukan submit GET biasa: submit biasa
         menavigasi seluruh halaman ke URL fragmen telanjang. -->
    <form th:attr="hx-get=@{__${basePath ?: '/bank-soal'}__/paket/{id}/pinjam(id=${paket.id})}"
          hx-target="#panel-pinjam" hx-swap="innerHTML"
          class="mb-4 flex items-end gap-2 text-sm">
      <div>
        <label for="sourcePaketId" class="block font-medium text-slate-700">Ambil dari Paket</label>
        <select id="sourcePaketId" name="sourcePaketId" onchange="this.form.requestSubmit()"
                class="mt-1 rounded border border-slate-300 px-2 py-1.5">
          <option value="">-- Paket --</option>
          <option th:each="p : ${paketLain}" th:value="${p.id}" th:text="${p.title}"
                  th:selected="${sumber != null and sumber.id == p.id}">Paket</option>
        </select>
      </div>
    </form>
    <p th:if="${#lists.isEmpty(paketLain)}" class="text-sm text-slate-500">
      Belum ada Paket lain di Subject ini yang bisa dipinjam.
    </p>

    <form th:if="${sumber != null}" method="post"
          th:action="@{__${basePath ?: '/bank-soal'}__/paket/{id}/pinjam(id=${paket.id})}">
      <div class="mb-3">
        <label for="topicTujuan" class="block text-sm font-medium text-slate-700">Masukkan ke Topic</label>
        <select id="topicTujuan" name="topicId" required
                class="mt-1 rounded border border-slate-300 px-2 py-1.5 text-sm">
          <option th:each="t : ${topics}" th:value="${t.id}" th:text="${t.title}">Topic</option>
        </select>
      </div>

      <div th:each="t : ${topicSumber}" th:with="soalT=${soalSumber[t.id]}" class="mb-3">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-semibold" th:text="${t.title}">Topic sumber</h3>
          <button type="submit" name="sourceTopicId" th:value="${t.id}"
                  class="rounded border border-slate-300 px-2 py-1 text-xs hover:bg-slate-100">
            Salin seluruh Topic ini
          </button>
        </div>
        <label th:each="q : ${soalT ?: {}}"
               th:unless="${sudahDipinjam.contains(q.id)}"
               class="flex items-center gap-2 py-1 text-sm">
          <input type="checkbox" name="questionIds" th:value="${q.id}" class="rounded border-slate-300">
          <span th:text="${#strings.abbreviate(q.bodyText, 100)}">Cuplikan soal</span>
        </label>
      </div>

      <button type="submit"
              class="mt-2 rounded bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">
        Salin soal terpilih
      </button>
    </form>
  </div>

</div>
</body>
</html>
