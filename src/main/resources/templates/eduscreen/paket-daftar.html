<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Paket Master')}"></head>
<body>
<div th:replace="~{layout/base :: page('Paket Master Eduscreen', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <section class="mb-6 rounded border border-slate-200 bg-white p-4">
      <form method="get" th:action="@{/eduscreen/paket}" class="flex flex-wrap items-end gap-3 text-sm">
        <div class="flex-1">
          <label for="q" class="block font-medium text-slate-700">Cari paket</label>
          <input type="text" id="q" name="q" th:value="${q}" placeholder="Judul paket..."
                 class="mt-1 w-full rounded border border-slate-300 px-2 py-1.5">
        </div>
        <button type="submit" class="rounded bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-800">Cari</button>
      </form>

      <form method="post" th:action="@{/eduscreen/paket}" class="mt-3 flex items-end gap-2 border-t border-slate-100 pt-3 text-sm">
        <div class="flex-1">
          <label for="title" class="block font-medium text-slate-700">Paket baru</label>
          <input type="text" id="title" name="title" required placeholder="mis. Persiapan UTS Matematika Kelas 4"
                 class="mt-1 w-full rounded border border-slate-300 px-2 py-1.5">
        </div>
        <button type="submit" class="rounded border border-slate-300 px-4 py-2 font-medium hover:bg-slate-100">Buat</button>
      </form>
    </section>

    <table class="w-full border-collapse text-sm">
      <thead>
        <tr class="border-b border-slate-200 text-left text-slate-500">
          <th class="py-2">Judul</th>
          <th class="py-2">Status</th>
          <th class="py-2">Aksi</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${daftar}" class="border-b border-slate-100">
          <td class="py-2" th:text="${p.title}">Judul paket</td>
          <td class="py-2">
            <span th:if="${p.published}" class="rounded bg-emerald-50 px-2 py-1 text-xs font-medium text-emerald-700">Terbit</span>
            <span th:unless="${p.published}" class="rounded bg-slate-100 px-2 py-1 text-xs font-medium text-slate-600">Belum terbit</span>
          </td>
          <td class="py-2">
            <a th:href="@{/eduscreen/paket/{id}(id=${p.id})}" class="text-slate-600 underline">Buka perakit</a>
          </td>
        </tr>
        <tr th:if="${daftar.totalElements == 0}">
          <td colspan="3" class="py-4 text-slate-500">Belum ada paket master.</td>
        </tr>
      </tbody>
    </table>

    <div class="mt-4 flex items-center justify-between text-sm text-slate-500" th:if="${daftar.totalPages > 0}">
      <span th:text="|Halaman ${daftar.number + 1} dari ${daftar.totalPages}|">Halaman</span>
      <div class="space-x-2">
        <a th:if="${daftar.hasPrevious()}" th:href="@{/eduscreen/paket(q=${q}, page=${daftar.number - 1})}"
           class="rounded border border-slate-300 px-2 py-1 hover:bg-slate-100">Sebelumnya</a>
        <a th:if="${daftar.hasNext()}" th:href="@{/eduscreen/paket(q=${q}, page=${daftar.number + 1})}"
           class="rounded border border-slate-300 px-2 py-1 hover:bg-slate-100">Berikutnya</a>
      </div>
    </div>

  </div>
</div>
</body>
</html>
