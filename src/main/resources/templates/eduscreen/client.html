<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Client')}"></head>
<body>
<div th:replace="~{layout/base :: page('Client', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <div th:if="${param.dibuat}" role="status" class="alert alert-success mb-6">
      Client dibuat. Undangan sudah dikirim ke Client Admin pertamanya.
    </div>

    <section class="card mb-8 p-0">
      <h2 class="card-title border-b border-line px-5 py-4">Client terdaftar</h2>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Nama</th>
            <th scope="col">Zona waktu</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="c : ${clients}">
            <td class="font-medium" th:text="${c.name}">Nama</td>
            <td class="text-ink-2" th:text="${c.timezone}">Asia/Jakarta</td>
            <td><span th:class="${c.status.name() == 'ACTIVE'} ? 'badge badge-success' : 'badge'" th:text="${c.status}">ACTIVE</span></td>
          </tr>
          <tr th:if="${#lists.isEmpty(clients)}">
            <td colspan="3" class="py-8 text-center text-ink-2">Belum ada Client.</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!--
      Onboarding sengaja TIDAK membuat Ruangan maupun akun Siswa (BR-O01). Susunan kelas adalah
      pengetahuan Client Admin, bukan Eduscreen; menebaknya di sini akan menghasilkan Ruangan
      kosong yang harus dihapus satu per satu.
    -->
    <section class="card p-6">
      <h2 class="card-title">Client baru</h2>
      <form method="post" th:action="@{/eduscreen/client}" class="mt-4 grid gap-4 sm:grid-cols-2">
        <div>
          <label for="name" class="label">Nama sekolah</label>
          <input id="name" name="name" required class="input">
        </div>
        <div>
          <label for="timezone" class="label">Zona waktu</label>
          <!-- Tiga zona Indonesia; seluruh batas akhir ditafsirkan di zona ini (BR-T02). -->
          <select id="timezone" name="timezone" class="select">
            <option value="Asia/Jakarta">Asia/Jakarta (WIB)</option>
            <option value="Asia/Makassar">Asia/Makassar (WITA)</option>
            <option value="Asia/Jayapura">Asia/Jayapura (WIT)</option>
          </select>
        </div>
        <div>
          <label for="adminFullName" class="label">Nama Client Admin</label>
          <input id="adminFullName" name="adminFullName" required class="input">
        </div>
        <div>
          <label for="adminEmail" class="label">Email Client Admin</label>
          <input type="email" id="adminEmail" name="adminEmail" required class="input">
        </div>
        <fieldset class="sm:col-span-2">
          <legend class="label">Paket konten master yang diberikan</legend>
          <!--
            Akses, bukan salinan (ADR-0021): sekolah membaca versi terbit Paket master apa adanya.
            Batas waktu dan versi bisa diatur belakangan di Akses Paket.
          -->
          <div class="mt-2 grid grid-cols-1 gap-2 sm:grid-cols-2">
            <label th:each="p : ${paket}" class="opt items-center py-3">
              <input type="checkbox" name="paketIds" th:value="${p.id}">
              <span class="text-sm font-medium" th:text="${p.title}">Judul paket</span>
            </label>
            <p th:if="${#lists.isEmpty(paket)}" class="text-sm text-ink-2 sm:col-span-2">
              Belum ada paket master.
            </p>
          </div>
        </fieldset>
        <div class="sm:col-span-2 border-t border-line pt-4">
          <button type="submit" class="btn btn-primary w-full sm:w-auto">
            Buat Client dan kirim undangan
          </button>
        </div>
      </form>
    </section>

  </div>
</div>
</body>
</html>
