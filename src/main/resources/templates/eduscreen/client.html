<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Client')}"></head>
<body>
<div th:replace="~{layout/base :: page('Client', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <section class="card mb-8 p-0">
      <h2 class="card-title border-b border-line px-5 py-4">Client terdaftar</h2>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Nama</th>
            <th scope="col">Zona waktu</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="c : ${clients}">
            <td class="font-medium">
              <a th:href="@{/eduscreen/client/{id}(id=${c.id})}" th:text="${c.name}"
                 class="hover:underline">Nama</a>
            </td>
            <td class="text-ink-2" th:text="${c.timezone}">Asia/Jakarta</td>
            <td><span th:class="${c.status.name() == 'ACTIVE'} ? 'badge badge-success' : 'badge'" th:text="${c.status}">ACTIVE</span></td>
          </tr>
          <tr th:if="${#lists.isEmpty(clients)}">
            <td colspan="3" class="py-8 text-center text-ink-2">Belum ada Client.</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Formulir onboarding di halamannya sendiri: nama, zona waktu, Client Admin pertama, dan
         Akses Paket di satu layar. Onboarding sengaja TIDAK membuat Ruangan maupun akun Siswa
         (BR-O01); susunan kelas adalah pengetahuan Client Admin, bukan Eduscreen. -->
    <section class="card flex flex-wrap items-center justify-between gap-3">
      <p class="text-sm text-ink-2">Nama, zona waktu, Client Admin, dan Akses Paket diisi di satu layar.</p>
      <a th:href="@{/eduscreen/client/baru}" class="btn btn-primary">Buat Client</a>
    </section>

  </div>
</div>
</body>
</html>
