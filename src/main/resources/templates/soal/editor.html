<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${soal != null} ? 'Ubah Soal' : 'Soal Baru')}"></head>
<body>
<div th:replace="~{layout/base :: page(${soal != null} ? 'Ubah Soal' : 'Soal Baru', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <!--
      Formulir yang sama dipakai untuk membuat dan mengubah soal (TC-14). Membuat memakai POST
      biasa yang berakhir redirect ke halaman detail (kontrak: 302), mengubah memakai HTMX PUT
      yang membalas fragmen "detail" di tempat — makanya hx-put/hx-target/hx-swap hanya terisi
      saat ${soal} sudah ada; Thymeleaf membuang atribut yang nilainya null.
    -->
    <div id="soal-editor" th:fragment="detail">

      <!-- Editor selalu dibuka dari dalam satu Paket (Bank Soal Client maupun ruang kerja
           master), jadi jalan pulangnya ke isi Paket itu (ADR-0018). -->
      <a th:href="@{__${basePath ?: '/bank-soal'}__/paket/{id}(id=${paket.id})}" class="crumb">← <span th:text="${paket.title}">Paket</span></a>

      <div th:if="${soal != null}" class="alert alert-success mb-4"
           id="pesan-simpan" role="status">
        Tersimpan.
      </div>

      <!-- Menyimpan ke jalur per-Paket: paketId ada di URL, bukan disimpulkan dari Topic (AC-B02). -->
      <form th:action="@{__${basePath ?: '/bank-soal'}__/paket/{id}/soal(id=${paket.id})}"
            method="post" class="space-y-4"
            th:attr="hx-put=${soal == null} ? null : @{__${basePath ?: '/bank-soal'}__/soal/{id}(id=${soal.id})},
                     hx-target=${soal != null} ? '#soal-editor' : null,
                     hx-swap=${soal != null} ? 'outerHTML' : null"
            x-data="soalEditor()">

        <section class="card grid grid-cols-1 gap-3 sm:grid-cols-2">
          <div>
            <label for="topicId" class="label">Topic</label>
            <!-- Daftar Topic sudah milik satu Paket (${paket}), dirender langsung dari server —
                 tidak ada cascading Subject->Topic lagi di sini sejak Subject tidak dipilih di
                 editor (ia sudah melekat pada Paket, ADR-0018). -->
            <select id="topicId" name="topicId" required
                    class="select">
              <option value="" th:selected="${topicId == null}">-- Topic --</option>
              <option th:each="t : ${topics}" th:value="${t.id}" th:text="${t.title}"
                      th:selected="${topicId != null and topicId == t.id}">Topic</option>
            </select>
          </div>
          <div>
            <label for="type" class="label">Tipe soal</label>
            <select id="type" name="type" x-model="tipe"
                    class="select">
              <option value="MULTIPLE_CHOICE"
                      th:selected="${soal == null or soal.type.name() == 'MULTIPLE_CHOICE'}">Pilihan Ganda</option>
              <option value="ESSAY" th:selected="${soal != null and soal.type.name() == 'ESSAY'}">Esai</option>
            </select>
          </div>
        </section>

        <section class="card">
          <label for="bodyHtml" class="label">Isi soal</label>
          <!-- Rumus dirender di sisi peramban, tidak pernah disimpan sebagai HTML hasil
               render (TC-24); itu keputusan internal, tidak perlu dibaca Guru. -->
          <p class="hint mb-2">
            Rumus ditulis LaTeX di antara <code class="rounded bg-surface-2 px-1">$...$</code> (sebaris) atau <code class="rounded bg-surface-2 px-1">$$...$$</code> (blok).
          </p>
          <textarea id="bodyHtml" name="bodyHtml" required rows="5"
                    th:text="${soal != null ? soal.bodyHtml : ''}"
                    class="textarea font-mono"></textarea>
        </section>

        <section x-show="tipe === 'MULTIPLE_CHOICE'" x-transition.opacity.duration.200ms class="card">
          <div class="mb-2 flex items-center justify-between">
            <label class="label">Pilihan jawaban</label>
            <button type="button" @click="tambahOpsi()"
                    class="btn btn-secondary btn-sm">
              + Tambah pilihan
            </button>
          </div>
          <template x-for="(o, idx) in opsi" :key="idx">
            <div class="mb-2 flex items-start gap-2 rounded-lg border border-line p-2"
                 :class="correctIndex === idx && 'border-success/50 bg-success-soft'">
              <input type="radio" name="correctIndex" :value="idx" x-model.number="correctIndex"
                     class="mt-3 accent-success" required aria-label="Tandai sebagai jawaban benar">
              <textarea name="optionBody" x-model="o.body" rows="2" required
                        class="textarea mt-0 flex-1 font-mono"></textarea>
              <button type="button" @click="hapusOpsi(idx)"
                      class="btn btn-ghost btn-sm text-danger">
                Hapus
              </button>
            </div>
          </template>
          <!-- Tepat satu Option benar (FR-016). -->
          <p class="hint">Tandai bulatan di sisi kiri pilihan yang benar. Tepat satu pilihan boleh ditandai.</p>
        </section>

        <section class="card">
          <label for="explanationHtml" class="label">Pembahasan (opsional)</label>
          <textarea id="explanationHtml" name="explanationHtml" rows="3"
                    th:text="${soal != null ? soal.explanationHtml : ''}"
                    class="textarea font-mono"></textarea>
        </section>

        <!-- Menulis soal baru di dalam Paket biasanya berderet: "buat lagi" kembali ke
             formulir Topic yang sama tanpa mampir ke halaman isi tiap satu soal. -->
        <div th:if="${soal == null}" class="flex flex-col gap-2 sm:flex-row">
          <button type="submit" name="lanjut" value="1" class="btn btn-primary">
            Simpan &amp; buat lagi
          </button>
          <button type="submit" class="btn btn-secondary">
            Simpan &amp; selesai
          </button>
        </div>
        <button th:unless="${soal == null}" type="submit" class="btn btn-primary">
          Simpan
        </button>
      </form>

      <!-- Panel unggah gambar, terpisah dari form utama: hasil unggahnya berupa tautan yang
           disalin manual ke textarea Isi soal / Pembahasan (editor sederhana, tanpa pustaka
           rich-text apa pun). -->
      <section class="card mt-6">
        <h2 class="card-title mb-2">Sisipkan gambar</h2>
        <form th:attr="hx-post=@{/gambar}" hx-encoding="multipart/form-data" hx-target="#gambar-hasil" hx-swap="innerHTML"
              class="flex flex-wrap items-center gap-3 text-sm">
          <input type="file" name="berkas" accept="image/png,image/jpeg" required
                 class="text-ink-2 file:btn file:btn-secondary file:btn-sm file:mr-3">
          <button type="submit" class="btn btn-primary btn-sm">Unggah</button>
        </form>
        <div id="gambar-hasil" class="mt-3"></div>
      </section>

      <!-- Pratinjau: bodyHtml/explanationHtml yang tersimpan SUDAH disanitasi allowlist saat
           ditulis (QuestionService, TC-22/TC-23), jadi th:utext di sini aman — bukan input
           mentah pengguna. -->
      <section th:if="${soal != null}" class="card mt-6">
        <h2 class="card-title mb-2">Pratinjau</h2>
        <div class="pratinjau-konten prose max-w-none" th:utext="${soal.bodyHtml}">Pratinjau isi soal</div>
        <div th:if="${soal.explanationHtml != null}" class="pratinjau-konten prose mt-3 max-w-none border-t border-line pt-3"
             th:utext="${soal.explanationHtml}">Pratinjau pembahasan</div>
      </section>

    </div>
  </div>
</div>

<!-- Fragmen hasil unggah gambar (POST /gambar): menampilkan pratinjau + tautan yang bisa
     disalin ke textarea, karena editor di sini sengaja textarea polos, bukan rich-text (TC-27,
     TC-28 -- penyimpanan lewat ImageService/FileStoragePort, bukan direktori statis). -->
<div th:fragment="gambarTerunggah" th:remove="tag" class="space-y-2">
  <img th:src="@{/gambar/{id}(id=${imageId})}" alt="Gambar terunggah" class="max-h-40 rounded-lg border border-line">
  <input type="text" readonly onclick="this.select()"
         th:value="|&lt;img src=&quot;/gambar/${imageId}&quot;&gt;|"
         class="input input-sm font-mono">
</div>

<script th:src="@{/vendor/katex/katex.min.js}" defer></script>
<script th:src="@{/vendor/katex/contrib/auto-render.min.js}" defer></script>
<script th:inline="javascript">
  document.addEventListener('alpine:init', function () {
    Alpine.data('soalEditor', function () {
      return {
        tipe: /*[[${soal != null ? soal.type.name() : 'MULTIPLE_CHOICE'}]]*/ 'MULTIPLE_CHOICE',
        correctIndex: 0,
        opsi: [
          /*[# th:each="o, it : ${opsi}"]*/
          {body: /*[[${o.bodyHtml}]]*/ '', benar: /*[[${o.correct}]]*/ false},
          /*[/]*/
        ],
        init: function () {
          this.opsi.forEach(function (o, idx) {
            if (o.benar) {
              this.correctIndex = idx;
            }
          }.bind(this));
          if (this.opsi.length === 0) {
            this.opsi = [{body: '', benar: true}, {body: '', benar: false}];
          }
        },
        tambahOpsi: function () {
          this.opsi.push({body: '', benar: false});
        },
        hapusOpsi: function (idx) {
          this.opsi.splice(idx, 1);
          if (this.correctIndex >= this.opsi.length) {
            this.correctIndex = 0;
          }
        }
      };
    });
  });

  // KaTeX dirender di klien saja; rumus tidak pernah disimpan sebagai HTML hasil render (TC-24).
  function renderPratinjauLatex() {
    var delimiter = [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false}
    ];
    document.querySelectorAll('.pratinjau-konten').forEach(function (el) {
      if (window.renderMathInElement) {
        renderMathInElement(el, {delimiters: delimiter});
      } else if (window.katex) {
        // auto-render.min.js tidak tersedia: render manual elemen ber-data-latex.
        el.querySelectorAll('[data-latex]').forEach(function (latex) {
          katex.render(latex.getAttribute('data-latex'), latex, {throwOnError: false});
        });
      }
    });
  }
  document.addEventListener('DOMContentLoaded', renderPratinjauLatex);
  document.body.addEventListener('htmx:afterSwap', renderPratinjauLatex);
</script>

</body>
</html>
