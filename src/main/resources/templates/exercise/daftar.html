<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Exercise')}"></head>
<body>
<div th:replace="~{layout/base :: page('Exercise', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <!-- Buat Exercise memakai POST biasa (bukan HTMX): kontraknya membalas 302 ke perakit
         (BR-E, FR-024), bukan fragmen (TC-14 hanya berlaku untuk endpoint HTMX).

         Tanpa kolom judul (BR-E06): judul, pemilihan soal referensi, dan penulisan soal sendiri
         semuanya terjadi di perakit. Menahan Guru di layar ini hanya untuk satu kolom membuat
         satu pekerjaan terpecah jadi dua layar. -->
    <section class="card mb-6 flex flex-wrap items-center justify-between gap-3">
      <p class="text-sm text-ink-2">Judulnya diisi di dalam perakit, bersama soal-soalnya.</p>
      <form th:action="@{/exercise}" method="post">
        <button type="submit" class="btn btn-primary">Buat Exercise</button>
      </form>
    </section>

    <!-- Cari se-Client (FR-004): navigasi biasa supaya tautan hasil pencarian tetap bisa disalin. -->
    <form method="get" th:action="@{/exercise}" class="mb-4 flex items-end gap-2">
      <div class="flex-1">
        <label for="q" class="label">Cari judul</label>
        <input type="search" id="q" name="q" th:value="${q}" placeholder="Kata kunci judul Exercise…" class="input">
      </div>
      <button type="submit" class="btn btn-secondary">Cari</button>
    </form>

    <div class="card p-0" th:if="${daftar.totalElements > 0}">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Judul</th>
            <th>Status</th>
            <th><span class="sr-only">Aksi</span></th>
          </tr>
        </thead>
        <tbody th:each="exercise : ${daftar}">
          <tr>
            <td class="font-medium">
              <a th:href="@{/exercise/{id}(id=${exercise.id})}" class="hover:text-accent" th:text="${exercise.title}">Judul Exercise</a>
            </td>
            <td>
              <span th:if="${exercise.locked}" class="badge badge-warn">Terkunci</span>
              <span th:unless="${exercise.locked}" class="badge">Draf</span>
            </td>
            <td class="text-right">
              <a th:href="@{/exercise/{id}(id=${exercise.id})}" class="btn btn-secondary btn-sm">Buka</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <p th:if="${daftar.totalElements == 0}" class="empty">Belum ada Exercise.</p>

    <div class="mt-4 flex items-center justify-between text-sm text-ink-2" th:if="${daftar.totalPages > 0}">
      <span th:text="|Halaman ${daftar.number + 1} dari ${daftar.totalPages}|">Halaman</span>
      <div class="flex gap-2">
        <a th:if="${daftar.hasPrevious()}" th:href="@{/exercise(q=${q}, page=${daftar.number - 1})}"
           class="btn btn-secondary btn-sm">Sebelumnya</a>
        <a th:if="${daftar.hasNext()}" th:href="@{/exercise(q=${q}, page=${daftar.number + 1})}"
           class="btn btn-secondary btn-sm">Berikutnya</a>
      </div>
    </div>

  </div>
</div>
</body>
</html>
