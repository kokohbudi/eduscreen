<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Assignment')}"></head>
<body>
<div th:replace="~{layout/base :: page('Assignment', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
      <!-- Navigasi biasa (bukan HTMX) supaya URL yang disaring tetap bisa disalin/di-bookmark. -->
      <form method="get" th:action="@{/guru/assignment}" class="w-full sm:w-auto">
        <label for="filterRuangan" class="label">Ruangan</label>
        <select id="filterRuangan" name="ruanganId" onchange="this.form.submit()" class="select sm:w-64">
          <option value="">Semua Ruangan</option>
          <option th:each="r : ${ruangan}" th:value="${r.id}" th:text="${r.name}"
                  th:selected="${param.ruanganId != null and #strings.equals(param.ruanganId[0], r.id.toString())}">
            Nama Ruangan
          </option>
        </select>
      </form>
      <a th:href="@{/guru/assignment/baru}" class="btn btn-primary">Terbitkan Assignment</a>
    </div>

    <div th:if="${#lists.isEmpty(assignments)}" class="empty">
      Belum ada Assignment untuk ditampilkan.
    </div>

    <div th:unless="${#lists.isEmpty(assignments)}" class="card p-0">
      <table class="table table-hover">
        <thead>
          <tr>
            <th scope="col">Judul</th>
            <th scope="col">Mode</th>
            <th scope="col">Status</th>
            <th scope="col">Batas akhir</th>
            <th scope="col"><span class="sr-only">Aksi</span></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="a : ${assignments}">
            <td class="font-medium">
              <a th:href="@{/guru/assignment/{id}(id=${a.id})}" class="hover:text-accent" th:text="${a.title}">Judul</a>
            </td>
            <td>
              <span th:class="${a.mode.name() == 'QUIZ'} ? 'badge badge-accent' : 'badge'"
                    th:text="${a.mode.name() == 'QUIZ' ? 'Quiz' : 'Latihan'}">Mode</span>
            </td>
            <td>
              <span th:class="${a.status.name() == 'PUBLISHED'} ? 'badge badge-success' : (${a.status.name() == 'DRAFT'} ? 'badge badge-warn' : 'badge')"
                    th:text="${a.status}">STATUS</span>
            </td>
            <td class="whitespace-nowrap text-ink-2" th:text="${#temporals.format(a.expiresAt, 'dd MMM yyyy HH:mm')}">Batas akhir</td>
            <td class="whitespace-nowrap text-right">
              <a th:href="@{/guru/assignment/{id}(id=${a.id})}" class="btn btn-ghost btn-sm">Detail</a>
              <a th:href="@{/guru/assignment/{id}/rekap(id=${a.id})}" class="btn btn-ghost btn-sm">Rekap</a>
              <a th:href="@{/guru/assignment/{id}/penilaian(id=${a.id})}" class="btn btn-ghost btn-sm">Penilaian</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
</body>
</html>
