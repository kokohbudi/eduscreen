<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Assignment')}"></head>
<body>
<div th:replace="~{layout/base :: page('Assignment', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
      <!-- Navigasi biasa (bukan HTMX) supaya URL yang disaring tetap bisa disalin/di-bookmark. -->
      <form method="get" th:action="@{/guru/assignment}" class="flex items-center gap-3 text-sm">
        <label for="filterRuangan" class="font-medium text-slate-700">Ruangan</label>
        <select id="filterRuangan" name="ruanganId" onchange="this.form.submit()"
                class="rounded border border-slate-300 px-2 py-1">
          <option value="">Semua Ruangan</option>
          <option th:each="r : ${ruangan}" th:value="${r.id}" th:text="${r.name}"
                  th:selected="${param.ruanganId != null and #strings.equals(param.ruanganId[0], r.id.toString())}">
            Nama Ruangan
          </option>
        </select>
      </form>
      <a th:href="@{/guru/assignment/baru}"
         class="rounded bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">
        Terbitkan Assignment
      </a>
    </div>

    <div th:if="${#lists.isEmpty(assignments)}"
         class="rounded border border-slate-200 bg-white p-6 text-center text-sm text-slate-500">
      Belum ada Assignment untuk ditampilkan.
    </div>

    <div th:unless="${#lists.isEmpty(assignments)}" class="overflow-x-auto">
      <table class="w-full border-collapse text-sm">
        <thead>
          <tr class="border-b border-slate-200 text-left text-slate-500">
            <th scope="col" class="py-2">Judul</th>
            <th scope="col" class="py-2">Mode</th>
            <th scope="col" class="py-2">Status</th>
            <th scope="col" class="py-2">Batas akhir</th>
            <th scope="col" class="py-2">Aksi</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="a : ${assignments}" class="border-b border-slate-100">
            <td class="py-2 font-medium text-slate-900" th:text="${a.title}">Judul</td>
            <td class="py-2" th:text="${a.mode.name() == 'QUIZ' ? 'Quiz' : 'Latihan'}">Mode</td>
            <td class="py-2" th:text="${a.status}">STATUS</td>
            <td class="py-2" th:text="${#temporals.format(a.expiresAt, 'dd MMM yyyy HH:mm')}">Batas akhir</td>
            <td class="py-2 space-x-2">
              <a th:href="@{/guru/assignment/{id}(id=${a.id})}" class="text-slate-600 underline">Detail</a>
              <a th:href="@{/guru/assignment/{id}/rekap(id=${a.id})}" class="text-slate-600 underline">Rekap</a>
              <a th:href="@{/guru/assignment/{id}/penilaian(id=${a.id})}" class="text-slate-600 underline">Penilaian</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
</body>
</html>
