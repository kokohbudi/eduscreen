<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Assignment')}"></head>
<body>
<div th:replace="~{layout/base :: page('Assignment', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
      <!-- Navigasi biasa (bukan HTMX) supaya URL yang disaring tetap bisa disalin/di-bookmark. -->
      <form method="get" th:action="@{/guru/assignment}" class="w-full sm:w-auto">
        <label for="filterRuangan" class="label">Ruangan</label>
        <select id="filterRuangan" name="ruanganId" onchange="this.form.submit()" class="select sm:w-64">
          <option value="">Semua Ruangan</option>
          <option th:each="r : ${ruangan}" th:value="${r.id}" th:text="${r.name}"
                  th:selected="${param.ruanganId != null and #strings.equals(param.ruanganId[0], r.id.toString())}">
            Nama Ruangan
          </option>
        </select>
      </form>
      <a th:href="@{/guru/assignment/baru}" class="btn btn-primary">Terbitkan Assignment</a>
    </div>

    <div th:if="${#lists.isEmpty(assignments)}" class="empty">
      Belum ada Assignment untuk ditampilkan.
    </div>

    <div th:unless="${#lists.isEmpty(assignments)}" class="card p-0">
      <table class="table table-hover">
        <thead>
          <tr>
            <th scope="col">Judul</th>
            <th scope="col">Mode</th>
            <th scope="col">Status</th>
            <th scope="col">Batas akhir</th>
            <th scope="col"><span class="sr-only">Aksi</span></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="a : ${assignments}">
            <td class="font-medium">
              <a th:href="@{/guru/assignment/{id}(id=${a.id})}" class="hover:text-accent" th:text="${a.title}">Judul</a>
            </td>
            <td>
              <span th:class="${a.mode.name() == 'QUIZ'} ? 'badge badge-accent' : 'badge'"
                    th:text="${a.mode.name() == 'QUIZ' ? 'Quiz' : 'Latihan'}">Mode</span>
            </td>
            <td>
              <span th:class="${a.status.name() == 'PUBLISHED'} ? 'badge badge-success' : (${a.status.name() == 'DRAFT'} ? 'badge badge-warn' : 'badge')"
                    th:text="${a.status}">STATUS</span>
            </td>
            <td class="whitespace-nowrap text-ink-2" th:text="${#temporals.format(a.expiresAt, 'dd MMM yyyy HH:mm')}">Batas akhir</td>
            <td class="whitespace-nowrap text-right">
              <!-- Lebih dari dua aksi, jadi digulung ke menu ellipsis (DESIGN.md, "Aturan aksi baris"). -->
              <div x-data="menuAksi" class="inline-block">
                <button type="button" x-ref="pemicu" @click="toggle()" class="btn btn-ghost btn-sm btn-icon"
                        aria-haspopup="menu" :aria-expanded="buka" title="Aksi lain" aria-label="Aksi lain">
                  <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/><circle cx="7.5" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="16.5" cy="12" r="1.1" fill="currentColor" stroke="none"/>
                  </svg>
                </button>
                <div x-ref="panel" x-show="buka" x-cloak role="menu" class="menu" :style="gaya"
                     x-transition.opacity.duration.200ms
                     @click="buka = false" @click.outside="tutupDariLuar($event)"
                     @keydown.escape.window="buka = false" @scroll.window="buka = false"
                     @resize.window="buka = false">
                <a role="menuitem" th:href="@{/guru/assignment/{id}(id=${a.id})}" class="menu-item">
                  <span>Detail</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                </a>
                <a role="menuitem" th:href="@{/guru/assignment/{id}/rekap(id=${a.id})}" class="menu-item">
                  <span>Rekap</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"/></svg>
                </a>
                <a role="menuitem" th:href="@{/guru/assignment/{id}/penilaian(id=${a.id})}" class="menu-item">
                  <span>Penilaian</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.745 3.745 0 013.296-1.043A3.745 3.745 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z"/></svg>
                </a>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
</body>
</html>
