<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Riwayat Siswa')}"></head>
<body>
<div th:replace="~{layout/base :: page('Riwayat Siswa', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <a th:href="@{/guru/assignment/{id}/rekap(id=${assignment.id})}" class="crumb">← Rekap nilai</a>
    <h2 class="text-lg font-semibold" th:text="${siswa.fullName}">Nama Siswa</h2>
    <p class="mb-6 text-sm text-ink-2" th:text="${assignment.title}">Judul Assignment</p>

    <div th:if="${#lists.isEmpty(pengerjaan)}" class="empty">
      Siswa ini belum pernah menekan Mulai pada Assignment ini.
    </div>

    <!--
      Nilai resmi Siswa adalah yang TERTINGGI di antara seluruh Attempt-nya (BR-L03, AC-L02).
      Seluruh Attempt tetap ditampilkan dan tetap bisa dibuka di sini — hanya baris dengan skor
      tertinggi yang ditandai, bukan disembunyikan.
    -->
    <div th:unless="${#lists.isEmpty(pengerjaan)}" class="card p-0">
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Attempt</th>
            <th scope="col">Mulai</th>
            <th scope="col">Status</th>
            <th scope="col">Sebab berakhir</th>
            <th scope="col">Skor</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="sesi : ${pengerjaan}"
              th:with="skor=${hasil.get(sesi.id)},
                       resmi=${skor != null and skorTertinggi != null
                                and skor.score.compareTo(skorTertinggi) == 0}">
            <td class="font-medium tabular-nums" th:text="${sesi.attemptNumber}">1</td>
            <td class="whitespace-nowrap text-ink-2" th:text="${#temporals.format(sesi.startedAt, 'dd MMM yyyy HH:mm')}">Mulai</td>
            <td><span class="badge" th:text="${sesi.status}">STATUS</span></td>
            <td class="text-ink-2" th:text="${sesi.terminalReason != null ? sesi.terminalReason : '—'}">Sebab</td>
            <td class="whitespace-nowrap">
              <span th:if="${skor == null}" class="text-ink-3">Belum dinilai</span>
              <span th:if="${skor != null}" class="tabular-nums font-medium"
                    th:text="|${#numbers.formatDecimal(skor.score * 100, 1, 2)}%|">0.00%</span>
              <span th:if="${skor != null and skor.status.name() == 'PENDING_REVIEW'}" role="status"
                    class="badge badge-warn ml-1">Sementara</span>
              <span th:if="${resmi}" class="badge badge-success ml-1">Nilai resmi</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
</body>
</html>
