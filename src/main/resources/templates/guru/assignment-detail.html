<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Detail Assignment')}"></head>
<body>
<div th:replace="~{layout/base :: page('Detail Assignment', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <!--
      Kartu ringkas: dipakai baik saat halaman ini dimuat penuh maupun sebagai fragment yang
      dikembalikan setelah perpanjang/tutup, karena keduanya memakai model "assignment" yang sama.
    -->
    <div th:fragment="ringkas" id="ringkas-assignment" class="card">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-lg font-semibold" th:text="${assignment.title}">Judul Assignment</h2>
        <span th:class="${assignment.status.name() == 'PUBLISHED'} ? 'badge badge-success' : (${assignment.status.name() == 'DRAFT'} ? 'badge badge-warn' : 'badge')"
              th:text="${assignment.status}">STATUS</span>
      </div>
      <dl class="mt-5 grid grid-cols-2 gap-x-6 gap-y-4 text-sm sm:grid-cols-3 lg:grid-cols-4">
        <div>
          <dt class="text-xs text-ink-2">Mode</dt>
          <dd class="mt-0.5 font-medium" th:text="${assignment.mode.name() == 'QUIZ' ? 'Quiz' : 'Latihan'}">Mode</dd>
        </div>
        <div>
          <dt class="text-xs text-ink-2">Timer</dt>
          <dd class="mt-0.5 font-medium" th:text="${assignment.timerDurationMinutes != null ? assignment.timerDurationMinutes + ' menit' : '—'}">
            Timer
          </dd>
        </div>
        <div>
          <dt class="text-xs text-ink-2">Batas akhir</dt>
          <dd class="mt-0.5 font-medium" th:text="${#temporals.format(assignment.expiresAt, 'dd MMM yyyy HH:mm')}">Batas akhir</dd>
        </div>
        <div>
          <dt class="text-xs text-ink-2">Maksimum percobaan</dt>
          <dd class="mt-0.5 font-medium" th:text="${assignment.maxAttempts}">1</dd>
        </div>
        <div>
          <dt class="text-xs text-ink-2">Acak urutan soal</dt>
          <dd class="mt-0.5 font-medium" th:text="${assignment.shuffleQuestions ? 'Ya' : 'Tidak'}">Ya</dd>
        </div>
        <div>
          <dt class="text-xs text-ink-2">Acak urutan opsi</dt>
          <dd class="mt-0.5 font-medium" th:text="${assignment.shuffleOptions ? 'Ya' : 'Tidak'}">Ya</dd>
        </div>
        <div>
          <dt class="text-xs text-ink-2">Pembahasan terbuka</dt>
          <dd class="mt-0.5 font-medium" th:text="${assignment.revealAnswersAt != null ? assignment.revealAnswersAt : '—'}">Pembahasan</dd>
        </div>
      </dl>
    </div>

    <!--
      Mode, Exercise, Timer, maxAttempts, dan kedua sakelar pengacakan terkunci begitu terbit
      (BR-A03): kartu ringkas di atas menampilkannya sebagai teks, bukan input, karena tidak ada
      lagi jalur formulir untuk mengubahnya di sini.
    -->

    <section class="card mt-6">
      <h2 class="card-title mb-3">Perpanjang batas akhir</h2>
      <!--
        Hanya diperpanjang, tidak pernah dimajukan (BR-A02, AC-A01): memajukan batas akhir akan
        memotong ujian Siswa yang sedang berjalan tanpa peringatan. Server menolak nilai yang lebih
        awal dari expiresAt sekarang; formulir ini tidak mencoba menegakkannya di klien.
      -->
      <form class="flex flex-wrap items-end gap-3"
            th:attr="hx-patch=@{/guru/assignment/{id}/perpanjang(id=${assignment.id})}"
            hx-target="#ringkas-assignment" hx-swap="outerHTML">
        <div class="w-full sm:w-auto">
          <label for="expiresAt" class="label">Batas akhir baru</label>
          <input type="datetime-local" id="expiresAt" name="expiresAt" required class="input sm:w-64">
        </div>
        <button type="submit" class="btn btn-primary">Perpanjang</button>
      </form>
    </section>

    <section class="mt-6 flex flex-wrap gap-2">
      <!--
        Menutup lebih awal memfinalisasi seluruh sesi yang masih berjalan di Assignment ini
        (BR-A05) — bukan sekadar mengubah status tampilan.
      -->
      <button th:if="${assignment.status.name() == 'PUBLISHED'}"
              th:attr="hx-post=@{/guru/assignment/{id}/tutup(id=${assignment.id})}"
              hx-target="#ringkas-assignment" hx-swap="outerHTML"
              hx-confirm="Tutup Assignment ini lebih awal? Seluruh pengerjaan yang masih berjalan akan difinalisasi sekarang."
              class="btn btn-danger">
        Tutup lebih awal
      </button>

      <!--
        Assignment yang sudah terbit tidak bisa dihapus, hanya ditutup (BR-A04); tombol ini hanya
        muncul selagi masih DRAFT.
      -->
      <button th:if="${assignment.draft}"
              th:attr="hx-delete=@{/guru/assignment/{id}(id=${assignment.id})}"
              hx-target="body" hx-swap="outerHTML"
              hx-confirm="Hapus draf Assignment ini? Tindakan ini tidak bisa dibatalkan."
              class="btn btn-danger">
        Hapus draf
      </button>

      <a th:href="@{/guru/assignment/{id}/rekap(id=${assignment.id})}" class="btn btn-secondary">Lihat rekap</a>
      <a th:href="@{/guru/assignment/{id}/penilaian(id=${assignment.id})}" class="btn btn-secondary">Antrean penilaian</a>
    </section>

  </div>
</div>
</body>
</html>
