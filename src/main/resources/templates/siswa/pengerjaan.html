<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${assignment.title})}"></head>
<body>
<div th:replace="~{layout/base :: page(${assignment.title}, ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <!--
      Heartbeat menjaga sesi login tetap hidup selagi Siswa mengerjakan, dan HANYA itu — ia BUKAN
      memperpanjang batas waktu pengerjaan (TC-32). Batas waktu murni wewenang server.
    -->
    <div th:attr="hx-post=@{/siswa/sesi/{id}/heartbeat(id=${sesi.id})}" hx-trigger="every 60s" hx-swap="none">

      <!--
        Bar waktu menempel di bawah topbar (top-14) supaya sisa waktu selalu terlihat saat Siswa
        menggulir soal panjang. Ini satu-satunya tempat backdrop-blur dipakai: bar melayang di
        atas konten, jadi blur di sini menyampaikan keadaan (bar tetap ada), bukan dekorasi.
      -->
      <div class="sticky top-14 z-[10] -mx-4 mb-6 border-b border-line bg-bg/85 px-4 py-3 backdrop-blur sm:-mx-6 sm:px-6"
           th:with="sesiUrl='/siswa/sesi/' + ${sesi.id}"
           th:attr="x-data=|countdown(${sisaDetik}, '${sesiUrl}')|">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <!--
            Hitung mundur: angkanya SELALU datang dari server (TC-15, BR-T03). Komponen Alpine di
            sini hanya menampilkan dan menyinkronkan ulang secara berkala — tidak pernah menghitung
            sisa waktu dari jam perangkat Siswa sendiri.
          -->
          <div class="flex items-baseline gap-2">
            <span class="text-xs text-ink-2">Sisa waktu</span>
            <span class="font-mono text-2xl font-semibold tabular-nums tracking-tight" x-text="tampil">00:00</span>
          </div>
          <form th:action="@{/siswa/sesi/{id}/selesai(id=${sesi.id})}" method="post"
                onsubmit="return confirm('Selesaikan pengerjaan sekarang? Jawaban yang sudah tersimpan tidak bisa diubah lagi setelah ini.');">
            <button type="submit" class="btn btn-primary btn-sm">Selesai</button>
          </form>
        </div>

        <!--
          Indikator koneksi (AC-S06): TIDAK ADA penyimpanan jawaban di peramban untuk
          disinkronkan belakangan (ADR-0006) — pengerjaan membutuhkan koneksi aktif. Yang
          ditunjukkan di sini murni status antrean HTMX yang sedang mencoba ulang kiriman gagal.
        -->
        <div x-show="!daring" x-cloak role="alert" class="alert alert-warn mt-3">
          Koneksi terputus — jawaban yang belum terkirim sedang diantre dan dicoba ulang.
        </div>
      </div>

      <!--
        Fragmen "soal" membawa DUA elemen: peta soal dan batang soal. Peta ikut dalam setiap
        balasan auto-save/navigasi sebagai swap out-of-band (hx-swap-oob) supaya penanda
        "terjawab" dan posisi aktif selalu berasal dari server yang sama dengan jawabannya
        (TC-13/TC-14) — bukan ditebak di klien. Pada muat awal atribut hx-swap-oob tidak
        berarti apa-apa (HTMX hanya membacanya dari balasan), jadi satu markup melayani
        keduanya.
      -->
      <th:block th:fragment="soal">
      <!-- Peta soal: navigasi Quiz bebas ke soal mana pun (berbeda dari Practice). -->
      <div id="peta-soal" hx-swap-oob="true"
           class="mb-6 grid grid-cols-8 gap-1.5 sm:grid-cols-10" role="navigation" aria-label="Peta soal">
        <!-- th:each dan th:replace dipisah: th:replace diproses lebih dulu bila di elemen yang sama. -->
        <th:block th:each="i : ${#numbers.sequence(0, soal.total() - 1)}">
          <th:block th:replace="~{siswa/fragmen-simpan :: tombolPeta(${sesi.id}, ${i}, ${i == soal.sessionQuestion().position}, ${terjawab.contains(i)}, false)}"/>
        </th:block>
      </div>

      <div id="soal">
        <!-- th:utext dipakai karena question.bodyHtml sudah tersanitasi saat ditulis (TC-22). -->
        <div class="card prose mb-4 max-w-none" th:utext="${soal.question().bodyHtml}">Batang soal</div>

        <div th:if="${soal.question().type.name() == 'MULTIPLE_CHOICE'}" class="space-y-2">
          <!--
            Urutan Option dirender PERSIS seperti diberikan (${soal.options()}), TIDAK diurutkan
            ulang — itu urutan yang sudah dibekukan snapshot sesi ini (BR-S02).
          -->
          <label th:each="opsi, iter : ${soal.options()}" class="opt"
                 th:for="|opsi-${soal.sessionQuestion().id}-${iter.index}|">
            <input type="radio" th:id="|opsi-${soal.sessionQuestion().id}-${iter.index}|"
                   name="selectedOptionId" th:value="${opsi.id}"
                   th:checked="${soal.answer() != null and soal.answer().selectedOptionId == opsi.id}"
                   th:attr="hx-put=@{/siswa/sesi/{sid}/jawaban/{qid}(sid=${sesi.id},qid=${soal.sessionQuestion().id})}"
                   hx-trigger="change" hx-target="#status-simpan" hx-swap="outerHTML">
            <span class="prose prose-opsi min-w-0 flex-1" th:utext="${opsi.bodyHtml}">Pilihan</span>
          </label>
        </div>

        <div th:if="${soal.question().type.name() == 'ESSAY'}">
          <label th:for="|essay-${soal.sessionQuestion().id}|" class="label">Jawaban</label>
          <textarea th:id="|essay-${soal.sessionQuestion().id}|" name="essayText" rows="6"
                    th:attr="hx-put=@{/siswa/sesi/{sid}/jawaban/{qid}(sid=${sesi.id},qid=${soal.sessionQuestion().id})}"
                    hx-trigger="keyup changed delay:800ms" hx-target="#status-simpan" hx-swap="outerHTML"
                    class="textarea"
                    th:text="${soal.answer() != null ? soal.answer().essayText : ''}"></textarea>
        </div>

        <!--
          Sasaran swap auto-save. Menyimpan jawaban Quiz tidak mengubah soalnya, jadi balasannya
          (fragmen "tersimpan" di bawah) hanya mengganti baris ini dan satu tombol peta lewat
          swap out-of-band — bukan batang soal, opsi, atau textarea yang sedang diketik (TC-14).
        -->
        <p id="status-simpan" role="status" class="hint mt-2"
           th:text="${soal.question().type.name() == 'ESSAY'} ? 'Tersimpan otomatis saat Anda berhenti mengetik.' : 'Pilihan tersimpan otomatis.'">Tersimpan otomatis.</p>
      </div>
      </th:block>
    </div>

    <script th:src="@{/vendor/katex/katex.min.js}" defer></script>
    <script th:src="@{/vendor/katex/contrib/auto-render.min.js}" defer></script>
    <script>
      // Render KaTeX untuk rumus LaTeX di batang soal/opsi. Dipanggil lagi setelah tiap swap
      // HTMX karena auto-save dan navigasi soal mengganti markup lewat innerHTML/outerHTML,
      // bukan lewat muat ulang halaman penuh.
      function eduscreenRenderMath(root) {
        if (window.renderMathInElement) {
          window.renderMathInElement(root, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ]
          });
        }
      }
      document.addEventListener('DOMContentLoaded', function () { eduscreenRenderMath(document.body); });
      document.body.addEventListener('htmx:afterSwap', function (e) { eduscreenRenderMath(e.detail.target); });
    </script>
  </div>
</div>
</body>
</html>
