<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Beranda')}"></head>
<body>
<div th:replace="~{layout/base :: page('Beranda', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <div class="rounded-lg border border-slate-200 bg-white p-6">
      <p class="text-slate-700">
        Masuk sebagai
        <strong th:text="${#authentication.principal.fullName()}">Nama</strong>
        dengan peran
        <strong th:text="${#authentication.principal.role()}">PERAN</strong>.
      </p>
      <p class="mt-4 text-sm text-slate-500">
        Portal per peran dan seluruh alur latihan menyusul di cerita pengguna berikutnya.
        Halaman ini ada untuk membuktikan tata letak, sesi, dan rangkaian keamanan bekerja.
      </p>
    </div>

  </div>
</div>
</body>
</html>
