<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf?.token}">
  <meta name="_csrf_header" th:content="${_csrf?.headerName}">
  <title th:text="|${pageTitle} · Eduscreen|">Eduscreen</title>
  <link rel="stylesheet" th:href="@{/css/output.css}">
  <link rel="stylesheet" th:href="@{/vendor/katex/katex.min.css}">
  <script th:src="@{/vendor/htmx/htmx.min.js}" defer></script>
  <script th:src="@{/vendor/alpine/cdn.min.js}" defer></script>
</head>
<body>

<!--
  Tata letak dasar seluruh halaman.

  Spanduk demo (TC-47) permanen dan tidak bisa ditutup pengguna. Ia ada supaya tidak ada yang
  keliru menganggap lingkungan peragaan sebagai sistem sungguhan: di sana autentikasi palsu —
  satu password berlaku untuk semua akun.
-->
<!-- Token CSRF dipasang sekali di sini, bukan per-halaman: HTMX mewarisi hx-headers dari
     elemen leluhur, jadi fragmen yang di-swap ke dalam halaman ikut terlindungi tanpa harus
     membawa tokennya sendiri. Sebelumnya tiap templat memasangnya pada elemen ber-th:remove="tag",
     yang membuang atributnya bersama tag-nya sehingga semua POST/PUT/DELETE HTMX dijawab 403. -->
<div th:fragment="page(pageTitle, content)" class="min-h-screen bg-slate-50 text-slate-900"
     th:attr="hx-headers=|{&quot;${_csrf.headerName}&quot;: &quot;${_csrf.token}&quot;}|">

  <div th:if="${@environment.getProperty('eduscreen.demo-banner', T(java.lang.Boolean), false)}"
       class="bg-amber-500 px-4 py-2 text-center text-sm font-semibold text-amber-950"
       role="status">
    LINGKUNGAN PERAGAAN — data di sini karangan dan autentikasinya tidak nyata.
    Jangan pernah memasukkan data siswa sungguhan.
  </div>

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <a th:href="@{/}" class="text-lg font-bold tracking-tight text-slate-900">Eduscreen</a>

      <!-- Nav khusus Eduscreen Admin. Templat bukan pagar keamanan — SecurityConfig yang menjaga
           rute Eduscreen di back end — tapi menampilkan pintu yang tidak boleh dibuka adalah cacat
           tersendiri, jadi sec:authorize di sini menutupnya di lapis tampilan (BR-P04). -->
      <nav id="nav-eduscreen" sec:authorize="hasRole('EDUSCREEN_ADMIN')"
           class="flex items-center gap-4 text-sm"
           xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <a th:href="@{/eduscreen}" th:classappend="${menuAktif == 'dashboard'} ? 'font-bold text-slate-900' : 'text-slate-600'"
           th:attr="aria-current=${menuAktif == 'dashboard'} ? 'page' : null"
           class="hover:text-slate-900">Dashboard</a>
        <a th:href="@{/eduscreen/client}" th:classappend="${menuAktif == 'client'} ? 'font-bold text-slate-900' : 'text-slate-600'"
           th:attr="aria-current=${menuAktif == 'client'} ? 'page' : null"
           class="hover:text-slate-900">Client</a>
        <a th:href="@{/eduscreen/bank-soal}" th:classappend="${menuAktif == 'bank-soal'} ? 'font-bold text-slate-900' : 'text-slate-600'"
           th:attr="aria-current=${menuAktif == 'bank-soal'} ? 'page' : null"
           class="hover:text-slate-900">Bank Soal</a>
      </nav>

      <div sec:authorize="isAuthenticated()" class="flex items-center gap-4 text-sm"
           xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <span class="text-slate-600" th:text="${#authentication.principal.fullName()}">Nama</span>
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="rounded border border-slate-300 px-3 py-1 hover:bg-slate-100">
            Keluar
          </button>
        </form>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-8">
    <h1 class="mb-6 text-2xl font-bold" th:text="${pageTitle}">Judul</h1>
    <div th:replace="${content}">Isi halaman</div>
  </main>

</div>
</body>
</html>
