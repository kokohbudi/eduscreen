<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Anggota Ruangan')}"></head>
<body>
<div th:replace="~{layout/base :: page('Anggota Ruangan', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <p class="mb-1 text-sm text-slate-500">
      <a th:href="@{/admin/ruangan}" class="underline">Ruangan</a> /
      <span th:text="${ruangan.name}">Nama Ruangan</span>
    </p>
    <p class="mb-6 text-sm" th:text="${ruangan.status}">STATUS</p>

    <!--
      Ruangan ARCHIVED menolak anggota baru (FR-010): formulir tetap tampil supaya riwayatnya
      bisa dilihat, tetapi tidak disembunyikan di sini — penolakannya berasal dari RuanganService,
      dan permintaan yang tetap dikirim akan berhenti di sana dengan galat yang seragam.
    -->
    <section th:if="${ruangan.status.name() != 'ARCHIVED'}"
             class="mb-8 rounded border border-slate-200 bg-white p-4">
      <h2 class="mb-3 text-lg font-semibold">Tambah anggota</h2>
      <form class="grid grid-cols-1 gap-3 sm:grid-cols-3"
            th:attr="hx-post=@{/admin/ruangan/{id}/anggota(id=${ruangan.id})}"
            hx-target="#anggota-ruangan" hx-swap="outerHTML">
        <div class="sm:col-span-2">
          <label for="userIds" class="block text-sm font-medium text-slate-700">Pengguna</label>
          <select id="userIds" name="userIds" multiple required size="6"
                  class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none">
            <option th:each="kandidat : ${kandidat}" th:value="${kandidat.id}"
                    th:text="|${kandidat.fullName} (${kandidat.email})|">Nama (email)</option>
          </select>
        </div>
        <div>
          <label for="memberRole" class="block text-sm font-medium text-slate-700">Sebagai</label>
          <select id="memberRole" name="memberRole" required
                  class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none">
            <option value="GURU">Guru</option>
            <option value="SISWA">Siswa</option>
          </select>
          <button type="submit"
                  class="mt-3 w-full rounded bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">
            Tambahkan
          </button>
        </div>
      </form>
    </section>

    <div th:fragment="anggota" id="anggota-ruangan" class="grid grid-cols-1 gap-8 sm:grid-cols-2">
      <section>
        <h2 class="mb-3 text-lg font-semibold">Guru</h2>
        <ul class="divide-y divide-slate-100 rounded border border-slate-200 bg-white">
          <li th:each="member : ${guru}" class="flex items-center justify-between px-3 py-2 text-sm">
            <span th:text="${member.fullName}">Nama</span>
            <button th:attr="hx-delete=@{/admin/ruangan/{id}/anggota/{userId}(id=${ruangan.id},userId=${member.id})}"
                    hx-target="#anggota-ruangan" hx-swap="outerHTML"
                    class="text-red-700 hover:underline">
              Keluarkan
            </button>
          </li>
          <li th:if="${#lists.isEmpty(guru)}" class="px-3 py-2 text-sm text-slate-400">Belum ada Guru.</li>
        </ul>
      </section>
      <section>
        <h2 class="mb-3 text-lg font-semibold">Siswa</h2>
        <ul class="divide-y divide-slate-100 rounded border border-slate-200 bg-white">
          <li th:each="member : ${siswa}" class="flex items-center justify-between px-3 py-2 text-sm">
            <span th:text="${member.fullName}">Nama</span>
            <button th:attr="hx-delete=@{/admin/ruangan/{id}/anggota/{userId}(id=${ruangan.id},userId=${member.id})}"
                    hx-target="#anggota-ruangan" hx-swap="outerHTML"
                    class="text-red-700 hover:underline">
              Keluarkan
            </button>
          </li>
          <li th:if="${#lists.isEmpty(siswa)}" class="px-3 py-2 text-sm text-slate-400">Belum ada Siswa.</li>
        </ul>
      </section>
    </div>

  </div>
</div>
</body>
</html>
