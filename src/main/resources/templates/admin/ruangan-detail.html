<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Anggota Ruangan')}"></head>
<body>
<div th:replace="~{layout/base :: page('Anggota Ruangan', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <a th:href="@{/admin/ruangan}" class="crumb">← Ruangan</a>
    <div class="mb-6 flex flex-wrap items-center gap-2">
      <h2 class="text-lg font-semibold" th:text="${ruangan.name}">Nama Ruangan</h2>
      <span th:class="${ruangan.status.name() == 'ARCHIVED'} ? 'badge' : 'badge badge-success'" th:text="${ruangan.status}">STATUS</span>
    </div>

    <!--
      Ruangan ARCHIVED menolak anggota baru (FR-010): formulir tetap tampil supaya riwayatnya
      bisa dilihat, tetapi tidak disembunyikan di sini — penolakannya berasal dari RuanganService,
      dan permintaan yang tetap dikirim akan berhenti di sana dengan galat yang seragam.
    -->
    <section th:if="${ruangan.status.name() != 'ARCHIVED'}" class="card mb-8">
      <h2 class="card-title mb-3">Tambah anggota</h2>
      <form class="grid grid-cols-1 gap-3 sm:grid-cols-3"
            th:attr="hx-post=@{/admin/ruangan/{id}/anggota(id=${ruangan.id})}"
            hx-target="#anggota-ruangan" hx-swap="outerHTML">
        <div class="sm:col-span-2">
          <label for="userIds" class="label">Pengguna</label>
          <select id="userIds" name="userIds" multiple required size="6" class="select h-auto bg-none py-1">
            <option th:each="kandidat : ${kandidat}" th:value="${kandidat.id}"
                    th:text="|${kandidat.fullName} (${kandidat.email})|" class="rounded px-2 py-1">Nama (email)</option>
          </select>
          <p class="hint">Tahan Ctrl / ⌘ untuk memilih lebih dari satu.</p>
        </div>
        <div>
          <label for="memberRole" class="label">Sebagai</label>
          <select id="memberRole" name="memberRole" required class="select">
            <option value="GURU">Guru</option>
            <option value="SISWA">Siswa</option>
          </select>
          <button type="submit" class="btn btn-primary mt-3 w-full">Tambahkan</button>
        </div>
      </form>
    </section>

    <div th:fragment="anggota" id="anggota-ruangan" class="grid grid-cols-1 gap-6 sm:grid-cols-2">
      <section class="card p-0">
        <h2 class="border-b border-line px-4 py-3 text-sm font-semibold">Guru</h2>
        <ul class="divide-y divide-line">
          <li th:each="member : ${guru}" class="flex items-center justify-between gap-3 px-4 py-2.5 text-sm">
            <span th:text="${member.fullName}">Nama</span>
            <button th:attr="hx-delete=@{/admin/ruangan/{id}/anggota/{userId}(id=${ruangan.id},userId=${member.id})}"
                    hx-target="#anggota-ruangan" hx-swap="outerHTML"
                    class="btn btn-ghost btn-sm text-danger">
              Keluarkan
            </button>
          </li>
          <li th:if="${#lists.isEmpty(guru)}" class="px-4 py-6 text-center text-sm text-ink-2">Belum ada Guru.</li>
        </ul>
      </section>
      <section class="card p-0">
        <h2 class="border-b border-line px-4 py-3 text-sm font-semibold">Siswa</h2>
        <ul class="divide-y divide-line">
          <li th:each="member : ${siswa}" class="flex items-center justify-between gap-3 px-4 py-2.5 text-sm">
            <span th:text="${member.fullName}">Nama</span>
            <button th:attr="hx-delete=@{/admin/ruangan/{id}/anggota/{userId}(id=${ruangan.id},userId=${member.id})}"
                    hx-target="#anggota-ruangan" hx-swap="outerHTML"
                    class="btn btn-ghost btn-sm text-danger">
              Keluarkan
            </button>
          </li>
          <li th:if="${#lists.isEmpty(siswa)}" class="px-4 py-6 text-center text-sm text-ink-2">Belum ada Siswa.</li>
        </ul>
      </section>
    </div>

  </div>
</div>
</body>
</html>
