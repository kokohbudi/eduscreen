<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Pengguna')}"></head>
<body>
<div th:replace="~{layout/base :: page('Pengguna', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <!-- Formulir tambah pengguna: dijawab satu baris tabel lewat HTMX (TC-14). -->
    <section class="mb-8 rounded border border-slate-200 bg-white p-4">
      <h2 class="mb-3 text-lg font-semibold">Tambah pengguna</h2>
      <form class="grid grid-cols-1 gap-3 sm:grid-cols-4"
            th:attr="hx-post=@{/admin/pengguna}"
            hx-target="#tabel-pengguna" hx-swap="beforeend">
        <div class="sm:col-span-2">
          <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
          <input type="email" id="email" name="email" required
                 class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none">
        </div>
        <div>
          <label for="fullName" class="block text-sm font-medium text-slate-700">Nama lengkap</label>
          <input type="text" id="fullName" name="fullName" required
                 class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none">
        </div>
        <div>
          <label for="role" class="block text-sm font-medium text-slate-700">Peran</label>
          <select id="role" name="role" required
                  class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none">
            <option th:each="r : ${peran}" th:value="${r}" th:text="${r}">PERAN</option>
          </select>
        </div>
        <div class="sm:col-span-4">
          <button type="submit"
                  class="rounded bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">
            Undang pengguna
          </button>
        </div>
      </form>
    </section>

    <!-- Formulir ubah: hanya tampil saat sebuah pengguna dibuka lewat GET /admin/pengguna/{id}. -->
    <section th:if="${terpilih}" class="mb-8 rounded border border-slate-200 bg-white p-4">
      <h2 class="mb-3 text-lg font-semibold">Ubah pengguna</h2>
      <p class="mb-3 text-sm text-slate-500" th:text="${terpilih.email}">email@contoh.id</p>
      <form class="grid grid-cols-1 gap-3 sm:grid-cols-4"
            th:attr="hx-put=@{/admin/pengguna/{id}(id=${terpilih.id})},hx-target=|#pengguna-${terpilih.id}|"
            hx-swap="outerHTML">
        <div class="sm:col-span-2">
          <label for="fullNameUbah" class="block text-sm font-medium text-slate-700">Nama lengkap</label>
          <input type="text" id="fullNameUbah" name="fullName" required th:value="${terpilih.fullName}"
                 class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none">
        </div>
        <div>
          <label for="roleUbah" class="block text-sm font-medium text-slate-700">Peran</label>
          <select id="roleUbah" name="role" required
                  class="mt-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none">
            <option th:each="r : ${peran}" th:value="${r}" th:text="${r}"
                    th:selected="${r == terpilih.role}">PERAN</option>
          </select>
        </div>
        <div class="flex items-end">
          <button type="submit"
                  class="rounded bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">
            Simpan
          </button>
        </div>
      </form>
    </section>

    <!-- Filter peran: navigasi halaman biasa, bukan HTMX, sehingga tautan tetap bisa disalin. -->
    <form method="get" th:action="@{/admin/pengguna}" class="mb-4 flex items-center gap-3 text-sm">
      <label for="filterRole" class="font-medium text-slate-700">Peran</label>
      <select id="filterRole" name="role" onchange="this.form.submit()"
              class="rounded border border-slate-300 px-2 py-1">
        <option value="" th:selected="${peranTerpilih == null}">Semua</option>
        <option th:each="r : ${peran}" th:value="${r}" th:text="${r}"
                th:selected="${r == peranTerpilih}">PERAN</option>
      </select>
    </form>

    <table class="w-full border-collapse text-sm" id="tabel-pengguna">
      <thead>
        <tr class="border-b border-slate-200 text-left text-slate-500">
          <th class="py-2">Nama</th>
          <th class="py-2">Email</th>
          <th class="py-2">Peran</th>
          <th class="py-2">Status</th>
          <th class="py-2">Aksi</th>
        </tr>
      </thead>
      <tbody th:fragment="baris" th:each="user : ${daftar}" th:id="|pengguna-${user.id}|"
             class="border-b border-slate-100 align-top">
        <tr>
          <td class="py-2" th:text="${user.fullName}">Nama</td>
          <td class="py-2" th:text="${user.email}">email@contoh.id</td>
          <td class="py-2" th:text="${user.role}">PERAN</td>
          <td class="py-2" th:text="${user.status}">STATUS</td>
          <td class="py-2 space-x-2">
            <a th:href="@{/admin/pengguna/{id}(id=${user.id})}" class="text-slate-600 underline">Ubah</a>
            <button th:if="${user.status.name() != 'DEACTIVATED'}"
                    th:attr="hx-post=@{/admin/pengguna/{id}/nonaktif(id=${user.id})},hx-target=|#pengguna-${user.id}|"
                    hx-swap="outerHTML" hx-confirm="Nonaktifkan pengguna ini? Riwayatnya tetap tersimpan."
                    class="rounded border border-red-200 px-2 py-1 text-red-700 hover:bg-red-50">
              Nonaktifkan
            </button>
            <button th:attr="hx-post=@{/admin/pengguna/{id}/undang-ulang(id=${user.id})},hx-target=|#konfirmasi-${user.id}|"
                    hx-swap="innerHTML"
                    class="rounded border border-slate-300 px-2 py-1 hover:bg-slate-100">
              Undang ulang
            </button>
            <span class="block text-xs text-emerald-700" th:id="|konfirmasi-${user.id}|"></span>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Konfirmasi kecil untuk undang-ulang; hanya berisi pesan singkat (bukan JSON, TC-14). -->
    <span th:fragment="konfirmasi" th:text="${pesan}">Undangan terkirim ulang.</span>

    <div class="mt-4 flex items-center justify-between text-sm text-slate-500" th:if="${pengguna}">
      <span th:text="|Halaman ${pengguna.number + 1} dari ${pengguna.totalPages == 0 ? 1 : pengguna.totalPages}|">Halaman</span>
      <div class="space-x-2">
        <a th:if="${pengguna.hasPrevious()}"
           th:href="@{/admin/pengguna(role=${peranTerpilih}, page=${pengguna.number - 1})}"
           class="rounded border border-slate-300 px-2 py-1 hover:bg-slate-100">Sebelumnya</a>
        <a th:if="${pengguna.hasNext()}"
           th:href="@{/admin/pengguna(role=${peranTerpilih}, page=${pengguna.number + 1})}"
           class="rounded border border-slate-300 px-2 py-1 hover:bg-slate-100">Berikutnya</a>
      </div>
    </div>

  </div>
</div>
</body>
</html>
