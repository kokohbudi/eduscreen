<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Pengguna')}"></head>
<body>
<div th:replace="~{layout/base :: page('Pengguna', ~{::content})}">
  <div th:fragment="content" th:remove="tag">

    <!-- Formulir tambah pengguna: dijawab satu baris tabel lewat HTMX (TC-14). -->
    <section class="card mb-6">
      <h2 class="card-title mb-3">Tambah pengguna</h2>
      <form class="grid grid-cols-1 gap-3 sm:grid-cols-4"
            th:attr="hx-post=@{/admin/pengguna}"
            hx-target="#tabel-pengguna" hx-swap="beforeend">
        <div class="sm:col-span-2">
          <label for="email" class="label">Email</label>
          <input type="email" id="email" name="email" required class="input">
        </div>
        <div>
          <label for="fullName" class="label">Nama lengkap</label>
          <input type="text" id="fullName" name="fullName" required class="input">
        </div>
        <div>
          <label for="role" class="label">Peran</label>
          <select id="role" name="role" required class="select">
            <option th:each="r : ${peran}" th:value="${r}" th:text="${r}">PERAN</option>
          </select>
        </div>
        <div class="sm:col-span-4">
          <button type="submit" class="btn btn-primary w-full sm:w-auto">Undang pengguna</button>
        </div>
      </form>
    </section>

    <!-- Formulir ubah: hanya tampil saat sebuah pengguna dibuka lewat GET /admin/pengguna/{id}. -->
    <section th:if="${terpilih}" class="card mb-6 border-accent/40">
      <h2 class="card-title">Ubah pengguna</h2>
      <p class="mb-3 text-sm text-ink-2" th:text="${terpilih.email}">email@contoh.id</p>
      <form class="grid grid-cols-1 gap-3 sm:grid-cols-4"
            th:attr="hx-put=@{/admin/pengguna/{id}(id=${terpilih.id})},hx-target=|#pengguna-${terpilih.id}|"
            hx-swap="outerHTML">
        <div class="sm:col-span-2">
          <label for="fullNameUbah" class="label">Nama lengkap</label>
          <input type="text" id="fullNameUbah" name="fullName" required th:value="${terpilih.fullName}" class="input">
        </div>
        <div>
          <label for="roleUbah" class="label">Peran</label>
          <select id="roleUbah" name="role" required class="select">
            <option th:each="r : ${peran}" th:value="${r}" th:text="${r}"
                    th:selected="${r == terpilih.role}">PERAN</option>
          </select>
        </div>
        <div class="flex items-end">
          <button type="submit" class="btn btn-primary w-full">Simpan</button>
        </div>
      </form>
    </section>

    <!-- Filter peran: navigasi halaman biasa, bukan HTMX, sehingga tautan tetap bisa disalin. -->
    <form method="get" th:action="@{/admin/pengguna}" class="mb-4 w-full sm:w-64">
      <label for="filterRole" class="label">Saring peran</label>
      <select id="filterRole" name="role" onchange="this.form.submit()" class="select">
        <option value="" th:selected="${peranTerpilih == null}">Semua</option>
        <option th:each="r : ${peran}" th:value="${r}" th:text="${r}"
                th:selected="${r == peranTerpilih}">PERAN</option>
      </select>
    </form>

    <!-- Aksi massal (AC-B26): centang beberapa pengguna lalu undang ulang / nonaktifkan sekaligus.
         Form biasa + redirect ke daftar dengan saringan peran yang sama. -->
    <form method="post" th:action="@{/admin/pengguna/massal}" x-data="massal" @change="hitung()">
    <input type="hidden" name="role" th:if="${peranTerpilih != null}" th:value="${peranTerpilih}">
    <div class="card p-0">
      <table class="table table-hover" id="tabel-pengguna">
        <thead>
          <tr>
            <th class="w-8"><span class="sr-only">Pilih</span></th>
            <th>Nama</th>
            <th>Email</th>
            <th>Peran</th>
            <th>Status</th>
            <th><span class="sr-only">Aksi</span></th>
          </tr>
        </thead>
        <tbody th:fragment="baris" th:each="user : ${daftar}" th:id="|pengguna-${user.id}|" class="align-top">
          <tr>
            <td>
              <input type="checkbox" name="userIds" th:value="${user.id}" data-massal
                     th:attr="aria-label=|Pilih ${user.fullName}|">
            </td>
            <td class="font-medium" th:text="${user.fullName}">Nama</td>
            <td class="text-ink-2" th:text="${user.email}">email@contoh.id</td>
            <td><span class="badge" th:text="${user.role}">PERAN</span></td>
            <td>
              <span th:class="${user.status.name() == 'DEACTIVATED'} ? 'badge' : (${user.status.name() == 'ACTIVE'} ? 'badge badge-success' : 'badge badge-warn')"
                    th:text="${user.status}">STATUS</span>
            </td>
            <td class="text-right">
              <!-- Lebih dari dua aksi, jadi digulung ke menu ellipsis (DESIGN.md, "Aturan aksi baris"). -->
              <div x-data="menuAksi" class="inline-block">
                <button type="button" x-ref="pemicu" @click="toggle()" class="btn btn-ghost btn-sm btn-icon"
                        aria-haspopup="menu" :aria-expanded="buka" title="Aksi lain" aria-label="Aksi lain">
                  <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/><circle cx="7.5" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="16.5" cy="12" r="1.1" fill="currentColor" stroke="none"/>
                  </svg>
                </button>
                <div x-ref="panel" x-show="buka" x-cloak role="menu" class="menu" :style="gaya"
                     x-transition.opacity.duration.200ms
                     @click="buka = false" @click.outside="tutupDariLuar($event)"
                     @keydown.escape.window="buka = false" @scroll.window="buka = false"
                     @resize.window="buka = false">
                <a role="menuitem" th:href="@{/admin/pengguna/{id}(id=${user.id})}" class="menu-item">
                  <span>Ubah</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>
                </a>
                <button role="menuitem" type="button"
                        th:attr="hx-post=@{/admin/pengguna/{id}/undang-ulang(id=${user.id})},hx-target=|#konfirmasi-${user.id}|"
                        hx-swap="innerHTML" class="menu-item">
                  <span>Undang ulang</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
                </button>
                <div class="menu-pisah" role="separator" th:if="${user.status.name() != 'DEACTIVATED'}"></div>
                <button role="menuitem" type="button" th:if="${user.status.name() != 'DEACTIVATED'}"
                        th:attr="hx-post=@{/admin/pengguna/{id}/nonaktif(id=${user.id})},hx-target=|#pengguna-${user.id}|"
                        hx-swap="outerHTML" hx-confirm="Nonaktifkan pengguna ini? Riwayatnya tetap tersimpan."
                        class="menu-item menu-item-danger">
                  <span>Nonaktifkan</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
                </button>
                </div>
              </div>
              <span class="mt-1 block text-xs text-success" th:id="|konfirmasi-${user.id}|"></span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div x-show="n > 0" x-cloak class="mt-3 flex flex-wrap items-center justify-between gap-2 text-sm">
      <span x-text="n + ' pengguna tercentang'"></span>
      <span class="flex gap-2">
        <button type="button" class="btn btn-ghost btn-sm" @click="bersihkan()">Bersihkan</button>
        <button type="submit" name="aksi" value="undang-ulang" class="btn btn-secondary btn-sm">Undang ulang</button>
        <button type="submit" name="aksi" value="nonaktif" class="btn btn-secondary btn-sm text-danger"
                @click="tanya('Nonaktifkan ' + n + ' pengguna? Riwayatnya tetap tersimpan.', $event)">Nonaktifkan</button>
      </span>
    </div>
    </form>

    <!-- Konfirmasi kecil untuk undang-ulang; hanya berisi pesan singkat (bukan JSON, TC-14). -->
    <span th:fragment="konfirmasi" th:text="${pesan}">Undangan terkirim ulang.</span>

    <div class="mt-4 flex items-center justify-between text-sm text-ink-2" th:if="${pengguna}">
      <span th:text="|Halaman ${pengguna.number + 1} dari ${pengguna.totalPages == 0 ? 1 : pengguna.totalPages}|">Halaman</span>
      <div class="flex gap-2">
        <a th:if="${pengguna.hasPrevious()}"
           th:href="@{/admin/pengguna(role=${peranTerpilih}, page=${pengguna.number - 1})}"
           class="btn btn-secondary btn-sm">Sebelumnya</a>
        <a th:if="${pengguna.hasNext()}"
           th:href="@{/admin/pengguna(role=${peranTerpilih}, page=${pengguna.number + 1})}"
           class="btn btn-secondary btn-sm">Berikutnya</a>
      </div>
    </div>

  </div>
</div>
</body>
</html>
